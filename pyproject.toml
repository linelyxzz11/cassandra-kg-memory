[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassmem"
version = "0.1.0"
description = "Persistent structured memory retrieval and online serving for LLM agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
